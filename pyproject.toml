[project]
name = "automation-task"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "allure-pytest>=2.16.2",
    "faker>=40.43.0",
    "mypy>=2.4.0",
    "playwright>=1.64.0",
    "pre-commit>=4.7.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-dotenv>=0.5.2",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.10.0",
    "pytest-rerunfailures>=16.7",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
